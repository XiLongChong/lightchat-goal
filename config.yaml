model:
  provider: deepseek
  default_model: "${DEEPSEEK_MODEL:-deepseek-v4-pro}"
  smart_model: "${DEEPSEEK_SMART_MODEL:-deepseek-v4-pro}"
  name: "${DEEPSEEK_MODEL:-deepseek-v4-pro}"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}"
  temperature: 0.7
  max_tokens: 4096
  context_window_tokens: "${MODEL_CONTEXT_WINDOW_TOKENS:-1000000}"
  timeout_s: "${LLM_TIMEOUT_S:-60}"
  max_retries: "${LLM_MAX_RETRIES:-1}"
  thinking:
    default: enabled
  native_tool_calls:
    chat_agent: true
    allowed_tools:
      - send_text_message
      - get_time
      - get_weather
      - memory
  routing_mode: manual_pro
  max_flash_upgrade_attempts: 1
  manual_flash_allow_upgrade: false
  flash_profile:
    model_name: deepseek-v4-flash
    temperature: 0.8
    max_tokens: 800
    timeout_seconds: 20
  pro_profile:
    model_name: deepseek-v4-pro
    temperature: 0.7
    max_tokens: 4096
    timeout_seconds: 40

server:
  host: "${HOST:-127.0.0.1}"
  port: "${PORT:-8899}"

api:
  chat_auth_enabled: "${CHAT_AUTH_ENABLED:-true}"
  chat_api_key_env: "${CHAT_API_KEY_ENV:-CHAT_API_KEY}"
  max_chat_total_chars: 4000
  max_user_id_len: 128
  max_message_chars: 1000
  max_messages_per_request: 8

agent:
  name: "${AGENT_NAME:-bot}"
  persona_file: "./prompts/persona.md"
  personality: ""

wechat:
  enabled: false
  token: ""
  base_url: "https://ilinkai.weixin.qq.com"
  goal_url: "http://127.0.0.1:8899"
  poll_timeout_ms: 35000
  message_delay: 0.8
  max_reply_delay: 3.0
  buffer_debounce_seconds: 2.0
  buffer_max_wait_seconds: 8.0
  chat_request_timeout_seconds: 200.0
  send_delay:
    enabled: true
    test_mode_zero_delay: false
    min_seconds: 0.4
    max_seconds: 3.5
    first_min: 0.2
    first_max: 0.8
    subsequent_short_min: 0.8
    subsequent_short_max: 1.8
    subsequent_long_min: 1.5
    subsequent_long_max: 3.5
    short_threshold_chars: 60
    jitter_enabled: true
  messages:
    max_count: 12
    soft_normal_count: 4
    max_single_chars: 500
    max_total_chars: 2000

history:
  short_term_turns: 12
  max_history_turns: 20

storage:
  db_path: "./data/memory.db"
  long_term_memory_dir: "./data/long_term_memory"

conversation:
  max_llm_steps: 20
  max_message_chars: 500
  max_total_chars: 2000
  idle_time_reminder_minutes: 10

weather:
  default_city: "成都"
  timeout_seconds: 4
  cache_ttl_seconds: 600

logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "./data/agent.log"
