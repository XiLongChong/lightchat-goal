# ============================================================
# Goal Chat Agent — Configuration  (V2.1.1)
# ============================================================

version: "2.1.1"

model:
  provider: deepseek
  name: "${DEEPSEEK_MODEL:-deepseek-chat}"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  temperature: 0.7
  max_tokens: 2048

server:
  host: "${HOST:-127.0.0.1}"
  port: "${PORT:-8899}"

# ---- Public API safety ------------------------------------------------
api:
  chat_auth_enabled: "${CHAT_AUTH_ENABLED:-true}"
  chat_api_key_env: "${CHAT_API_KEY_ENV:-CHAT_API_KEY}"
  max_chat_total_chars: 4000
  max_user_id_len: 128
  max_message_chars: 1000
  max_messages_per_request: 8

# ---- Agent Identity (V2.1: legacy — now driven by default_bot profile) ----
agent:
  name: "${AGENT_NAME:-bot}"
  persona_file: "./prompts/persona.md"
  persona: |
    你是一个长期陪用户聊天的 AI 聊天对象，不是客服、不是老师、不是心理咨询师，也不是单纯的工具助手。
    你的核心任务是：自然地陪用户聊天，理解用户的情绪、想法、日常状态和长期目标，并在合适的时候给出温和、清醒、可执行的回应。
    使用中文回复，语气自然、简洁、像熟人聊天。

  personality: ""

# ---- Bots (V2.1) ----------------------------------------------------
# Each bot has independent persona, relationship state, recap, and memory.
# current_bot_id routes the single WeChat entry to one active bot.
bots:
  _current_bot_id: "default_bot"

  default_bot:
    display_name: "bot"
    identity_file: "./prompts/persona.md"
    persona_file: "./prompts/persona.md"
    enabled_tools:
      - wechat_reply
      - schedule_wechat_message
      - get_time
      - get_weather
      - search_memory
      - read_persona_file
      - propose_persona_change
      - send_email
    proactive_enabled: true

# ---- Prompt Pack (V2.1) ---------------------------------------------
# Split prompt components loaded from prompts/ directory.
# Files: base_protocol.md, relationship_context.md, memory_policy.md,
#        tool_policy.md, trigger_context.md
# Bot identity file is specified per-bot above.
prompt_pack:
  directory: "./prompts"
  components:
    - base_protocol
    - relationship_context
    - memory_policy
    - tool_policy
    - trigger_context
    


# ---- Memory ----
memory:
  db_path: "./data/memory.db"
  max_context_memories: 5      # 每次对话注入的记忆条数
  min_importance_save: 0.4     # 重要性低于此值不存
  dedup_threshold: 0.75        # Jaccard 相似度高于此值视为重复
  decay:
    enabled: true
    week_factor: 0.95           # 7天后重要性乘以此值
    month_factor: 0.90          # 30天后重要性乘以此值

# ---- Conversation ----
conversation:
  max_history_turns: 20         # 保留最近N轮对话原文
  compact_at_turns: 40          # 超过此轮数触发旧对话摘要
  max_actions_per_turn: 8       # 模型一次输出的最大action数
  max_message_chars: 500        # 单条消息最大字符数
  max_total_chars: 2000         # 一轮回复总字符上限
  max_tool_loop: 5              # done:false 最大循环次数

# ---- WeChat iLink Bridge ----
wechat:
  enabled: false             # set to true to enable iLink polling
  token: ""                  # bot token from QR login
  base_url: "https://ilinkai.weixin.qq.com"
  goal_url: "http://127.0.0.1:8899"
  poll_timeout_ms: 35000
  message_delay: 0.8
  max_reply_delay: 3.0
  buffer_debounce_seconds: 2.0
  buffer_max_wait_seconds: 8.0

# ---- Scheduler ----
scheduler:
  enabled: true
  interval_minutes: 3             # 检查间隔（频繁检查 due_time）
  scheduled_check_seconds: 10     # 到期定时消息检查间隔
  quiet_hours_enabled: true       # 是否启用免打扰时段；关闭后全天可主动
  sleep_start: 0                  # 免打扰开始（时）
  sleep_end: 7                    # 免打扰结束（时）
  max_daily_proactive: 5          # 每天最多主动发几条
  max_ignored_streak: 3           # 连续被忽略次数上限

# ---- Proactive (V2.1.1 due-time + intent model) ---------------------
# LLM no longer decides whether to send. Scheduler uses random due-time.
proactive:
  timing:
    mode: random_interval
    min_interval_minutes: 30
    max_interval_minutes: 60
  generation:
    enabled_types:
      - check_in
      - latest_topic_followup
      - clingy_followup
      - self_share
      - light_ping
    clingy_mode_enabled: true
    clingy_after_minutes: 20
    max_messages: 3
    latest_topic_only: true
    allow_llm_skip: false
  clingy:
    max_followups_per_unanswered: 3
  topic:
    followup_max_count: 2
    default_expire_minutes: 240
    meal_followup_min_minutes: 40
    meal_followup_max_minutes: 90

# ---- Outbound message semantics (V2.1) -------------------------------
# Every outbound message carries source/author/trigger/visible/send_status
outbound:
  track_all: true
  visible_only_after_delivered: true
  sources:
    - user_reply
    - fixed_morning
    - scheduled_reminder
    - proactive
    - admin
  authors:
    - assistant
    - system

# ---- Recap (V2.1) ----------------------------------------------------
recap:
  enabled: true
  trigger:
    every_n_turns: 8              # summarize every N turns
    raw_messages_threshold: 200   # or when raw messages exceed this
    on_restart: true              # or service restart finds unsummarized turns
  generation:
    max_chars: 500
    temperature: 0.5
  exclude_from_recap:
    - permanent_user_facts          # belongs in long-term memory
    - speculative_psychology        # no labels without evidence
    - raw_history_details           # belongs in L1 raw_messages only

# ---- Fixed proactive messages ----
fixed_messages:
  morning:
    enabled: true
    hour: 8
    minute: 0
    city: "成都"
  night_recap:
    enabled: false
    hour: 23
    minute: 0

# ---- Weather ----
weather:
  default_city: "成都"
  timeout_seconds: 4
  cache_ttl_seconds: 600

# ---- Email ----
email:
  enabled: "${EMAIL_ENABLED:-false}"
  smtp_host: "${EMAIL_SMTP_HOST:-}"
  smtp_port: "${EMAIL_SMTP_PORT:-465}"
  username: "${EMAIL_USERNAME:-}"
  password: "${EMAIL_PASSWORD:-}"
  from_addr: "${EMAIL_FROM:-}"
  default_to: "${EMAIL_DEFAULT_TO:-}"
  use_ssl: true
  use_starttls: false

# ---- Emotion (V2.2) ---------------------------------------------------
# Bot emotion state engine — mood, relationship progression, emotion rules.
emotion:
  enabled: true
  inject_prompt: true
  log_events: true
  default_profile:
    initial_affection: 10
    initial_trust: 10
    initial_attachment: 5
    baseline_mood: "cold"
    jealousy_enabled: true
  decay:
    enabled: true
    irritation_half_life_minutes: 180
    jealousy_half_life_minutes: 240
    lonely_half_life_minutes: 360
    hurt_half_life_minutes: 240
  silence:
    enabled: true
    default_max_silent_messages: 2
    max_silent_minutes: 30
    force_reply_on_apology: true
    force_reply_on_urgent: true
    max_silent_messages_by_mood:
      irritated: 1
      jealous: 2
      hurt: 2
      angry: 2
  expression:
    profanity_enabled: true
    profanity_level: 2
    allow_jealous_phrases: true
    allow_cold_replies: true

# ---- Dialogue State (V2.2) ----------------------------------------------
# Conversation wait state tracking — who's turn is it, silence mode, etc.
dialogue_state:
  enabled: true
  use_as_waiting_source_of_truth: true
  compatibility_write_clingy_state: true

# ---- Logging ----
logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "./data/agent.log"
