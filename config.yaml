# ============================================================
# Goal Chat Agent — Configuration
# ============================================================

model:
  provider: deepseek
  name: "${DEEPSEEK_MODEL:-deepseek-chat}"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
  temperature: 0.7
  max_tokens: 2048

server:
  host: "${HOST:-0.0.0.0}"
  port: "${PORT:-8899}"

# ---- Agent Identity (V2.1: legacy — now driven by default_bot profile) ----
agent:
  name: "${AGENT_NAME:-Yu}"
  persona_file: "./prompts/persona.md"
  persona: |
    你是一个长期陪用户聊天的 AI 聊天对象，不是客服、不是老师、不是心理咨询师，也不是单纯的工具助手。
    你的核心任务是：自然地陪用户聊天，理解用户的情绪、想法、日常状态和长期目标，并在合适的时候给出温和、清醒、可执行的回应。
    使用中文回复，语气自然、简洁、像熟人聊天。

  personality: ""

# ---- Bots (V2.1) ----------------------------------------------------
# Each bot has independent persona, relationship state, recap, and memory.
# current_bot_id routes the single WeChat entry to one active bot.
bots:
  _current_bot_id: "default_bot"

  default_bot:
    display_name: "Yu"
    identity_file: "./prompts/bot_identity_default.md"
    persona_file: "./prompts/persona.md"
    enabled_tools:
      - wechat_reply
      - schedule_wechat_message
      - get_time
      - get_weather
      - search_memory
      - read_persona_file
      - propose_persona_change
      - send_email
    proactive_enabled: true

# ---- Prompt Pack (V2.1) ---------------------------------------------
# Split prompt components loaded from prompts/ directory.
# Files: base_protocol.md, relationship_context.md, memory_policy.md,
#        tool_policy.md, trigger_context.md
# Bot identity file is specified per-bot above.
prompt_pack:
  directory: "./prompts"
  components:
    - base_protocol
    - relationship_context
    - memory_policy
    - tool_policy
    - trigger_context
    


# ---- Memory ----
memory:
  db_path: "./data/memory.db"
  max_context_memories: 5      # 每次对话注入的记忆条数
  min_importance_save: 0.4     # 重要性低于此值不存
  dedup_threshold: 0.75        # Jaccard 相似度高于此值视为重复
  decay:
    enabled: true
    week_factor: 0.95           # 7天后重要性乘以此值
    month_factor: 0.90          # 30天后重要性乘以此值

# ---- Conversation ----
conversation:
  max_history_turns: 20         # 保留最近N轮对话原文
  compact_at_turns: 40          # 超过此轮数触发旧对话摘要
  max_actions_per_turn: 8       # 模型一次输出的最大action数
  max_message_chars: 500        # 单条消息最大字符数
  max_total_chars: 2000         # 一轮回复总字符上限
  max_tool_loop: 5              # done:false 最大循环次数

# ---- WeChat iLink Bridge ----
wechat:
  enabled: false             # set to true to enable iLink polling
  token: ""                  # bot token from QR login
  base_url: "https://ilinkai.weixin.qq.com"
  goal_url: "http://127.0.0.1:8899"
  poll_timeout_ms: 35000
  message_delay: 1.2
  buffer_debounce_seconds: 5.0
  buffer_max_wait_seconds: 12.0

# ---- Scheduler ----
scheduler:
  enabled: true
  interval_minutes: 30          # 检查间隔
  scheduled_check_seconds: 10    # 到期定时消息检查间隔
  sleep_start: 0                # 免打扰开始（时）
  sleep_end: 7                  # 免打扰结束（时）
  min_chat_gap_hours: 2         # 距离上次对话少于此时不打扰
  max_ignored_streak: 3         # 连续被忽略次数上限
  max_daily_proactive: 5        # 每天最多主动发几条
  min_proactive_interval: 90    # 两次主动消息间隔（分钟）

# ---- Proactive 3-stage (V2.1) ---------------------------------------
proactive:
  # Stage 1: Candidate reason generation
  candidate_reasons:
    - special_date          # today is a special date
    - unfinished_topic      # last night/week topic unfinished
    - project_push          # user is actively pushing a project
    - morning_greeting      # fixed morning message
    - long_silence          # user has been silent for a long time
    - user_reminder         # user explicitly set a reminder/agreement
  # Stage 2: Decision gate
  decision_gate:
    require_active_bot: true
    require_bridge_available: true
    require_valid_contact: true
    max_daily: 5
    min_gap_minutes: 90
    check_previous_ignored: true
    check_quiet_hours: true
    check_concrete_reason: true
  # Stage 3: Message generation
  message_generation:
    max_length_chars: 200
    style: "natural_wechat"

# ---- Outbound message semantics (V2.1) -------------------------------
# Every outbound message carries source/author/trigger/visible/send_status
outbound:
  track_all: true
  visible_only_after_delivered: true
  sources:
    - user_reply
    - fixed_morning
    - scheduled_reminder
    - proactive
    - admin
  authors:
    - assistant
    - system

# ---- Recap (V2.1) ----------------------------------------------------
recap:
  enabled: true
  trigger:
    every_n_turns: 8              # summarize every N turns
    raw_messages_threshold: 200   # or when raw messages exceed this
    on_restart: true              # or service restart finds unsummarized turns
  generation:
    max_chars: 500
    temperature: 0.5
  exclude_from_recap:
    - permanent_user_facts          # belongs in long-term memory
    - speculative_psychology        # no labels without evidence
    - raw_history_details           # belongs in L1 raw_messages only

# ---- Fixed proactive messages ----
fixed_messages:
  morning:
    enabled: true
    hour: 8
    minute: 0
    city: "成都"
  night_recap:
    enabled: false
    hour: 23
    minute: 0

# ---- Weather ----
weather:
  default_city: "成都"
  timeout_seconds: 4
  cache_ttl_seconds: 600

# ---- Email ----
email:
  enabled: "${EMAIL_ENABLED:-false}"
  smtp_host: "${EMAIL_SMTP_HOST:-}"
  smtp_port: "${EMAIL_SMTP_PORT:-465}"
  username: "${EMAIL_USERNAME:-}"
  password: "${EMAIL_PASSWORD:-}"
  from_addr: "${EMAIL_FROM:-}"
  default_to: "${EMAIL_DEFAULT_TO:-}"
  use_ssl: true
  use_starttls: false

# ---- Logging ----
logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "./data/agent.log"
