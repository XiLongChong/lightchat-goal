<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightChat 后台</title>
  <link rel="stylesheet" href="/static/admin.css?v=cleanup-20260529">
</head>
<body>
  <main id="loginView" class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <span>LightChat</span>
        <h1>进入控制台</h1>
        <p>查看对话、记忆、设置和运行日志。</p>
      </div>
      <label class="field"><span>访问密码</span><input id="loginPassword" type="password" autocomplete="current-password"></label>
      <p id="loginError" class="form-error" hidden></p>
      <button id="loginBtn" class="primary">进入后台</button>
    </section>
  </main>

  <main id="appView" hidden>
    <header class="topbar">
      <strong id="pageTitle">LightChat · 总览</strong>
      <div class="top-actions"><button id="refreshBtn">刷新</button></div>
    </header>

    <div class="app-layout">
      <aside class="sidebar">
        <nav class="side-nav" aria-label="主导航">
          <button class="nav-item active" data-tab="overview">总览</button>
          <button class="nav-item" data-tab="chat">聊天</button>
          <button class="nav-item" data-tab="memory">记忆</button>
          <button class="nav-item" data-tab="settings">设置</button>
          <button class="nav-item" data-tab="logs">日志</button>
        </nav>
      </aside>

      <section id="overview" class="panel active">
        <div class="hero">
          <h1>运行总览</h1>
          <button id="overviewRefreshBtn" class="primary">刷新状态</button>
        </div>
        <div id="qrWrap" class="qr-wrap" hidden>
          <div id="qrSvg" class="qr-svg" aria-label="微信部署二维码"></div>
          <img id="qrImage" alt="微信部署二维码" hidden>
          <a id="qrLink" href="#" target="_blank" rel="noreferrer" hidden>打开二维码链接</a>
          <p id="qrHint">用微信扫码确认。确认后会自动保存并启动桥接。</p>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>今日消息</span><strong id="usageTodayMessages">--</strong></div>
          <div class="metric"><span>今日 token</span><strong id="usageTodayTokens">--</strong></div>
          <div class="metric"><span>今日兜底</span><strong id="usageTodayFallbacks">--</strong></div>
          <div class="metric"><span>运行时长</span><strong id="usageUptime">--</strong></div>
          <div class="metric"><span>当前 bot</span><strong id="currentBot">--</strong></div>
        </div>
        <div class="page-grid">
          <section class="card">
            <div class="card-head"><h2>最新对话</h2><span id="bridgeBadge" class="status">读取中</span></div>
            <div id="overviewChat" class="chat-feed compact"></div>
          </section>
          <aside class="card">
            <h2>当前连接</h2>
            <div class="admin-actions">
              <select id="botSelect" title="切换 bot"></select>
              <button id="startDeployBtn">微信部署</button>
              <button id="startBridgeBtn">启动桥接</button>
              <button id="stopBridgeBtn">停止桥接</button>
            </div>
            <div id="focusList" class="row-list"></div>
          </aside>
        </div>
      </section>

      <section id="chat" class="panel">
        <div class="hero">
          <h1>聊天诊断</h1>
          <div class="segmented">
            <button class="active" data-chat-filter="all">最近</button>
            <button data-chat-filter="issues">异常</button>
            <button data-chat-filter="tools">工具</button>
          </div>
        </div>
        <div class="page-grid chat-layout">
          <section class="card"><div id="chatFeed" class="chat-feed"></div></section>
          <aside class="card sticky-card"><h2>本轮详情</h2><div id="turnDetail" class="row-list"></div></aside>
        </div>
      </section>

      <section id="memory" class="panel">
        <div class="hero">
          <h1>记忆状态</h1>
          <div class="hero-actions">
            <button id="generateRecapBtn">生成摘要</button>
            <button id="forgetAllBtn" class="danger">彻底遗忘</button>
            <button id="exportMemoryBtn" class="primary">导出记忆</button>
          </div>
        </div>
        <div class="page-grid">
          <section class="card">
            <div class="card-head"><h2>最近记忆</h2><button id="importMemoryBtn">导入</button></div>
            <div class="import-row">
              <input id="memoryFile" type="file" accept=".zip,.json,.md,.txt,application/zip,application/json,text/markdown,text/plain">
              <label><input id="clearBeforeImport" type="checkbox"> 导入前清空</label>
            </div>
            <p id="memoryImportHint" class="hint"></p>
            <div id="memoryList" class="row-list"></div>
          </section>
          <aside class="card"><h2>摘要与共享事实</h2><div id="recapList" class="row-list"></div></aside>
        </div>
      </section>

      <section id="settings" class="panel">
        <div id="settingsHome" class="settings-view active">
          <div class="hero"><h1>设置</h1></div>
          <div class="settings-grid">
            <button class="settings-entry" data-settings-view="personaSettings"><strong>人设提示词</strong><span>编辑角色底层提示词</span></button>
            <button class="settings-entry" data-settings-view="toolsSettings"><strong>微信与工具</strong><span>消息延迟、缓冲、天气工具</span></button>
            <button class="settings-entry" data-settings-view="emailSettings"><strong>邮箱</strong><span>SMTP 与默认收件人</span></button>
            <button class="settings-entry" data-settings-view="manualSettings"><strong>手动发送</strong><span>向最近联系人立即发送消息</span></button>
            <button class="settings-entry" data-settings-view="accountSettings"><strong>账号</strong><span>退出当前后台会话</span></button>
          </div>
        </div>

        <div id="personaSettings" class="settings-view">
          <div class="sub-hero"><button class="back-settings">← 返回设置</button><h1>人设提示词</h1></div>
          <section class="card">
            <label class="field"><textarea id="personaText" spellcheck="false"></textarea></label>
            <div class="form-actions"><button id="savePersonaBtn" class="primary">保存人设</button></div>
          </section>
        </div>

        <div id="toolsSettings" class="settings-view">
          <div class="sub-hero"><button class="back-settings">← 返回设置</button><h1>微信与工具</h1></div>
          <section class="card">
            <div class="form-grid two-col">
              <label class="field"><span>微信消息最小间隔</span><input id="messageDelay" type="number" min="0.2" max="10" step="0.1"></label>
              <label class="field"><span>模型延迟上限</span><input id="maxReplyDelay" type="number" min="0" max="10" step="0.1"></label>
              <label class="field"><span>连发缓冲</span><input id="bufferDebounceSeconds" type="number" min="0" max="20" step="0.1"></label>
              <label class="field"><span>最长缓冲等待</span><input id="bufferMaxWaitSeconds" type="number" min="0" max="60" step="0.1"></label>
              <label class="field"><span>默认城市</span><input id="defaultCity"></label>
              <label class="field"><span>天气超时</span><input id="weatherTimeout" type="number" min="1" max="20" step="0.5"></label>
              <label class="field"><span>天气缓存</span><input id="weatherCache" type="number" min="0" max="86400"></label>
            </div>
            <div class="form-actions"><button id="saveToolsBtn" class="primary">保存工具设置</button></div>
          </section>
        </div>

        <div id="emailSettings" class="settings-view">
          <div class="sub-hero"><button class="back-settings">← 返回设置</button><h1>邮箱</h1></div>
          <section class="card">
            <div class="form-grid two-col">
              <label class="field"><span>邮箱工具</span><select id="emailEnabled"><option value="true">启用</option><option value="false">关闭</option></select></label>
              <label class="field"><span>SMTP Host</span><input id="smtpHost" autocomplete="off"></label>
              <label class="field"><span>SMTP Port</span><input id="smtpPort" type="number" min="1" max="65535"></label>
              <label class="field"><span>邮箱用户名</span><input id="emailUsername" autocomplete="off"></label>
              <label class="field"><span>发件人</span><input id="emailFrom" autocomplete="off"></label>
              <label class="field"><span>默认收件人</span><input id="emailDefaultTo" autocomplete="off"></label>
            </div>
            <div class="form-actions"><button id="saveEmailBtn" class="primary">保存邮箱设置</button></div>
          </section>
        </div>

        <div id="manualSettings" class="settings-view">
          <div class="sub-hero"><button class="back-settings">← 返回设置</button><h1>手动发送</h1></div>
          <section class="card">
            <label class="field"><textarea id="manualText" placeholder="发给最近一次微信联系人"></textarea></label>
            <div class="hero-actions"><button id="manualSendBtn" class="primary">发送</button></div>
            <p id="sendHint" class="hint"></p>
          </section>
        </div>

        <div id="accountSettings" class="settings-view">
          <div class="sub-hero"><button class="back-settings">← 返回设置</button><h1>账号</h1></div>
          <section class="card"><button id="logoutBtn" class="danger">退出登录</button></section>
        </div>
      </section>

      <section id="logs" class="panel">
        <div class="hero">
          <h1>日志</h1>
          <div class="segmented">
            <button id="logIssuesOnly">问题</button>
            <button id="logAutoRefresh" class="active">自动刷新</button>
            <button id="refreshLogsBtn">刷新</button>
          </div>
        </div>
        <div class="page-grid">
          <section class="card"><h2>摘要</h2><div id="logSummary" class="row-list"></div></section>
          <aside class="card"><h2>原始日志</h2><p id="logMeta" class="hint"></p><div id="logConsole" class="log-console" role="log" aria-live="polite"></div></aside>
        </div>
      </section>
    </div>

    <nav class="mobile-nav" aria-label="移动导航">
      <button class="mobile-item active" data-tab="overview">总览</button>
      <button class="mobile-item" data-tab="chat">聊天</button>
      <button class="mobile-item" data-tab="memory">记忆</button>
      <button class="mobile-item" data-tab="settings">设置</button>
      <button class="mobile-item" data-tab="logs">日志</button>
    </nav>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/admin.js?v=cleanup-20260529"></script>
</body>
</html>
