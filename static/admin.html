<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lightchat</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main id="loginView" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <p class="eyebrow">LIGHTCHAT</p>
      <h1>欢迎回来</h1>
      <p class="subtitle">输入访问密码，进入你的聊天空间</p>
      <label class="login-field">
        <span>访问密码</span>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码">
      </label>
      <p id="loginError" class="login-error" hidden></p>
      <button id="loginBtn" class="login-btn">登录</button>
    </section>
  </main>

  <main id="appView" class="shell" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow">LIGHTCHAT</p>
        <h1>lightchat</h1>
        <p id="statusText">连接中</p>
      </div>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" title="切换明暗">◐</button>
        <button id="refreshBtn" class="icon-btn" title="刷新">↻</button>
      </div>
    </header>

    <section id="home" class="panel active">
      <div class="section-title">
        <h2>当前状态</h2>
        <p>查看微信部署、发送能力和最近联系人。</p>
      </div>

      <div class="status-hero">
        <div>
          <span id="deployBadge" class="status-badge">读取中</span>
          <h3 id="deployStatus">读取状态中</h3>
          <p id="deployDetail"></p>
        </div>
      </div>

      <div class="actions">
        <button id="startDeployBtn" class="primary">开始部署</button>
        <button id="startBridgeBtn">启动已保存部署</button>
      </div>

      <div id="qrWrap" class="qr-wrap" hidden>
        <div id="qrSvg" class="qr-svg" aria-label="微信部署二维码"></div>
        <img id="qrImage" alt="微信部署二维码" hidden>
        <a id="qrLink" class="qr-link" href="#" target="_blank" rel="noreferrer" hidden>打开二维码链接</a>
        <p id="qrHint" class="hint">用微信扫码确认。确认后会自动保存。</p>
      </div>
    </section>

    <section id="persona" class="panel">
      <div class="section-title">
        <h2>人设</h2>
        <p>这里只编辑人设层，系统协议由代码维护。</p>
      </div>
      <label class="field">
        <span>人设提示词</span>
        <textarea id="personaText" spellcheck="false"></textarea>
      </label>
      <button id="savePersonaBtn" class="primary">保存人设</button>
    </section>

    <section id="settings" class="panel settings-panel">
      <div class="section-title">
        <h2>设置</h2>
        <p>主动消息、工具参数、手动发送和账户操作。</p>
      </div>

      <details open>
        <summary>主动消息</summary>
        <div class="grid">
          <label class="field switch-row">
            <span>启用主动消息</span>
            <input id="schedulerEnabled" type="checkbox">
          </label>
          <label class="field">
            <span>主动检查间隔（分钟）</span>
            <input id="intervalMinutes" type="number" min="1" max="1440">
          </label>
          <label class="field">
            <span>两次主动消息最小间隔（分钟）</span>
            <input id="minProactiveInterval" type="number" min="1" max="1440">
          </label>
          <label class="field">
            <span>距离上次聊天至少（小时）</span>
            <input id="minChatGapHours" type="number" min="0" max="72" step="0.5">
          </label>
          <label class="field">
            <span>每天最多主动消息</span>
            <input id="maxDailyProactive" type="number" min="0" max="50">
          </label>
          <label class="field">
            <span>定时任务扫描（秒）</span>
            <input id="scheduledCheckSeconds" type="number" min="2" max="300">
          </label>
          <label class="field">
            <span>免打扰开始</span>
            <input id="sleepStart" type="number" min="0" max="23">
          </label>
          <label class="field">
            <span>免打扰结束</span>
            <input id="sleepEnd" type="number" min="0" max="23">
          </label>
        </div>
        <div class="actions">
          <button id="saveSchedulerBtn" class="primary">保存主动设置</button>
          <button id="triggerSchedulerBtn">触发一次主动判断</button>
        </div>
      </details>

      <details>
        <summary>工具</summary>
        <div class="grid">
          <label class="field">
            <span>微信消息最小间隔（秒）</span>
            <input id="messageDelay" type="number" min="0.2" max="10" step="0.1">
          </label>
          <label class="field">
            <span>天气超时（秒）</span>
            <input id="weatherTimeout" type="number" min="1" max="20" step="0.5">
          </label>
          <label class="field">
            <span>天气缓存（秒）</span>
            <input id="weatherCache" type="number" min="0" max="86400">
          </label>
          <label class="field switch-row">
            <span>启用邮件</span>
            <input id="emailEnabled" type="checkbox">
          </label>
          <label class="field">
            <span>SMTP Host</span>
            <input id="smtpHost" autocomplete="off">
          </label>
          <label class="field">
            <span>SMTP Port</span>
            <input id="smtpPort" type="number" min="1" max="65535">
          </label>
          <label class="field">
            <span>邮箱用户名</span>
            <input id="emailUsername" autocomplete="off">
          </label>
          <label class="field">
            <span>发件人</span>
            <input id="emailFrom" autocomplete="off">
          </label>
          <label class="field">
            <span>默认收件人</span>
            <input id="emailDefaultTo" autocomplete="off">
          </label>
        </div>
        <button id="saveToolsBtn" class="primary">保存工具设置</button>
      </details>

      <details>
        <summary>发送与任务</summary>
        <label class="field">
          <span>手动发送</span>
          <textarea id="manualText" placeholder="发给最近一次微信联系人"></textarea>
        </label>
        <p id="sendHint" class="hint"></p>
        <div class="actions">
          <button id="manualSendBtn" class="primary">发送</button>
          <button id="loadTasksBtn">刷新任务</button>
        </div>
        <div id="taskList" class="list"></div>
      </details>

      <details>
        <summary>记忆导入导出</summary>
        <div class="memory-tools">
          <label class="field">
            <span>导入文件（zip / json / md / txt）</span>
            <input id="memoryFile" type="file" accept=".zip,.json,.md,.txt,application/zip,application/json,text/markdown,text/plain">
          </label>
          <label class="field switch-row">
            <span>导入前清空现有记忆</span>
            <input id="clearBeforeImport" type="checkbox">
          </label>
          <div class="actions">
            <button id="importMemoryBtn" class="primary">导入记忆</button>
            <button id="exportMemoryBtn">导出记忆</button>
          </div>
          <p id="memoryImportHint" class="hint">支持这类 Claude 记忆包，会自动解析 zip 里的 Markdown 记忆。</p>
        </div>
      </details>

      <details>
        <summary>账户</summary>
        <button id="logoutBtn" class="danger">退出登录</button>
      </details>
    </section>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-item active" data-tab="home">首页</button>
      <button class="nav-item" data-tab="persona">人设</button>
      <button class="nav-item" data-tab="settings">设置</button>
    </nav>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/admin.js"></script>
</body>
</html>
